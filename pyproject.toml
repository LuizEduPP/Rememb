[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rememb"
version = "0.4.18"
description = "Persistent memory standard for AI agents — local, portable, zero config"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["ai", "agents", "memory", "llm", "mcp", "windsurf", "cursor", "claude", "copilot", "continue", "vscode", "persistent-memory", "ai-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Environment :: Console",
    "Operating System :: OS Independent",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "pypdf>=4.0.0",
    "mcp>=1.0.0,<2",
]

[project.scripts]
rememb = "rememb.cli:app"

[project.optional-dependencies]
dev = ["build", "twine", "pytest>=8.0.0", "httpx2>=2.0.0", "ruff>=0.11"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]
extend-exclude = ["src/rememb_skills", "tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W", "ARG", "B007", "RUF059"]
ignore = [
    "E501",
    "E731",
]

[tool.ruff.lint.isort]
known-first-party = ["rememb", "rememb_skills"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not docker"]
markers = [
    "docker: builds the Dockerfile against a registry (opt-in via REMEMB_DOCKER_SMOKE=1)",
]

[project.urls]
Homepage = "https://github.com/LuizEduPP/rememb"
Documentation = "https://github.com/LuizEduPP/rememb/blob/main/README.md"
Repository = "https://github.com/LuizEduPP/rememb"
Issues = "https://github.com/LuizEduPP/rememb/issues"
Changelog = "https://github.com/LuizEduPP/rememb/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rememb*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.json", "*.gif", "*.html", "*.png", "*.css", "*.js"]
rememb_skills = ["**/*"]

[tool.setuptools]
include-package-data = true
