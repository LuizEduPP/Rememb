[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rememb"
version = "0.4.19"
description = "Local-first long-term memory for AI agents — MCP, hooks, IDE handoff. No cloud, no API keys."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = [
    "long-term-memory",
    "agentic-memory",
    "ai-agents",
    "ai-memory",
    "local-first",
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "persistent-memory",
    "llm",
    "cursor",
    "claude",
    "vscode",
    "copilot",
    "windsurf",
    "cline",
    "handoff",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Environment :: Console",
    "Operating System :: OS Independent",
]
dependencies = [
"typer>=0.27.3",
    "rich>=15.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "pypdf>=6.21.2",
    "mcp>=1.0.0,<2",
]

[project.scripts]
rememb = "rememb.cli:app"

[project.optional-dependencies]
dev = ["build", "twine", "pytest>=8.0.0", "httpx2>=2.0.0", "ruff>=0.17.2"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]
extend-exclude = ["src/rememb_skills", "tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W", "ARG", "B007", "RUF059"]
ignore = [
    "E501",
    "E731",
]

[tool.ruff.lint.isort]
known-first-party = ["rememb", "rememb_skills"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not docker"]
markers = [
    "docker: builds the Dockerfile against a registry (opt-in via REMEMB_DOCKER_SMOKE=1)",
]

[project.urls]
Homepage = "https://github.com/LuizEduPP/rememb"
Documentation = "https://github.com/LuizEduPP/rememb/blob/main/README.md"
Repository = "https://github.com/LuizEduPP/rememb"
Issues = "https://github.com/LuizEduPP/rememb/issues"
Changelog = "https://github.com/LuizEduPP/rememb/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rememb*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.json", "*.gif", "*.html", "*.png", "*.css", "*.js"]
rememb_skills = ["**/*"]

[tool.setuptools]
include-package-data = true
